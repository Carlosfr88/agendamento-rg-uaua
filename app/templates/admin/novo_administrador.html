{% extends "base.html" %}

{% block title %}Novo Administrador - Painel Administrativo{% endblock %}

{% block content %}

<div class="admin-page">

    <div class="form-wrapper">

        <div class="form-header">

            <div>
                <h1>Novo administrador</h1>

                <p>
                    Cadastre um novo usuário para acessar o painel administrativo.
                </p>
            </div>

            <a
                href="{{ url_for('admin.administradores') }}"
                class="button-secondary"
            >
                Voltar
            </a>

        </div>


        <div class="form-card">

            <form method="post">

                <div class="form-group">

                    <label for="nome">
                        Nome
                    </label>

                    <input
                        type="hidden"
                        name="csrf_token"
                        value="{{ csrf_token() }}"
                    >

                    <input
                        id="nome"
                        name="nome"
                        type="text"
                        placeholder="Nome do administrador"
                        autocomplete="name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="username">
                        Usuário
                    </label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        placeholder="Nome de usuário para login"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="password">
                            Senha
                        </label>

                        <input
                            id="password"
                            name="password"
                            type="password"
                            placeholder="Digite a senha"
                            autocomplete="new-password"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="confirmar_senha">
                            Confirmar senha
                        </label>

                        <input
                            id="confirmar_senha"
                            name="confirmar_senha"
                            type="password"
                            placeholder="Digite novamente"
                            autocomplete="new-password"
                            required
                        >

                    </div>

                </div>


                <div class="form-actions">

                    <a
                        href="{{ url_for('admin.administradores') }}"
                        class="button-secondary"
                    >
                        Cancelar
                    </a>

                    <button
                        type="submit"
                        class="button-primary"
                    >
                        Criar administrador
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>


<style>

.admin-page {
    min-height: calc(100vh - 60px);

    padding: 35px;

    background: #f5f7fa;
}

.form-wrapper {
    max-width: 850px;
    margin: 0 auto;
}

.form-header {
    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 20px;

    margin-bottom: 25px;
}

.form-header h1 {
    margin: 0 0 6px;

    font-size: 28px;
    color: #1f2937;
}

.form-header p {
    margin: 0;

    color: #6b7280;
    font-size: 14px;
}

.form-card {
    background: #ffffff;

    border: 1px solid #e5e7eb;
    border-radius: 14px;

    padding: 30px;

    box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.04);
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;

    margin-bottom: 7px;

    font-size: 14px;
    font-weight: 600;

    color: #374151;
}

.form-group input {
    width: 100%;

    padding: 13px 14px;

    border: 1px solid #d8dee6;
    border-radius: 9px;

    background: #ffffff;

    font-size: 14px;

    outline: none;

    transition: 0.2s;
}

.form-group input:focus {
    border-color: #374151;

    box-shadow:
        0 0 0 3px rgba(55, 65, 81, 0.08);
}

.form-row {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 18px;
}

.form-actions {
    display: flex;

    justify-content: flex-end;

    gap: 10px;

    padding-top: 10px;

    border-top: 1px solid #e5e7eb;
}

.button-primary,
.button-secondary {
    min-height: 40px;

    display: inline-flex;

    align-items: center;
    justify-content: center;

    padding: 0 17px;

    border-radius: 9px;

    text-decoration: none;

    font-size: 14px;
    font-weight: 600;

    cursor: pointer;

    transition: 0.2s;
}

.button-primary {
    border: 0;

    background: #1f2937;
    color: #ffffff;
}

.button-primary:hover {
    background: #111827;
}

.button-secondary {
    border: 1px solid #d8dee6;

    background: #ffffff;
    color: #374151;
}

.button-secondary:hover {
    background: #f9fafb;
}

@media (max-width: 700px) {

    .admin-page {
        padding: 20px 15px;
    }

    .form-header {
        align-items: flex-start;
        flex-direction: column;
    }

    .form-card {
        padding: 22px 18px;
    }

    .form-row {
        grid-template-columns: 1fr;
        gap: 0;
    }

    .form-actions {
        flex-direction: column-reverse;
    }

    .button-primary,
    .button-secondary {
        width: 100%;
    }

}

</style>

{% endblock %}
