{% extends "base.html" %}

{% block title %}Editar Serviço - Agendamento RG{% endblock %}

{% block content %}

<section class="page-container">

    <div class="page-header">

        <div>
            <h1>Editar serviço</h1>

            <p>
                Atualize as informações do serviço.
            </p>
        </div>

        <a
            href="{{ url_for('admin.servicos') }}"
            class="secondary-button"
        >
            Voltar
        </a>

    </div>


    <div class="form-card">

        <form method="post">

            <div class="form-group">

                <label for="nome">
                    Nome do serviço
                </label>

                <input
                    id="nome"
                    name="nome"
                    type="text"
                    value="{{ servico.nome }}"
                    required
                >
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

            </div>


            <div class="form-group">

                <label for="descricao">
                    Descrição
                </label>

                <textarea
                    id="descricao"
                    name="descricao"
                    rows="4"
                >{{ servico.descricao or '' }}</textarea>

            </div>


            <div class="form-actions">

                <a
                    href="{{ url_for('admin.servicos') }}"
                    class="secondary-button"
                >
                    Cancelar
                </a>

                <button
                    type="submit"
                    class="primary-button"
                >
                    Salvar alterações
                </button>

            </div>

        </form>

    </div>

</section>


<style>

.page-container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 40px 20px;
}

.page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 25px;
}

.page-header h1 {
    margin: 0 0 6px;
    font-size: 28px;
    color: #1f2937;
}

.page-header p {
    margin: 0;
    color: #6b7280;
    font-size: 14px;
}

.form-card {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 30px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.05);
}

.form-group {
    margin-bottom: 22px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-size: 14px;
    font-weight: 600;
    color: #374151;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    font-size: 15px;
    font-family: Arial, Helvetica, sans-serif;
    outline: none;
}

.form-group input:focus,
.form-group textarea:focus {
    border-color: #374151;
    box-shadow: 0 0 0 3px rgba(55, 65, 81, 0.08);
}

.form-group textarea {
    resize: vertical;
}

.form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 10px;
}

.primary-button,
.secondary-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 40px;
    padding: 0 16px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}

.primary-button {
    border: 0;
    background: #1f2937;
    color: #ffffff;
}

.primary-button:hover {
    background: #111827;
}

.secondary-button {
    border: 1px solid #d1d5db;
    background: #ffffff;
    color: #374151;
}

.secondary-button:hover {
    background: #f3f4f6;
}

@media (max-width: 600px) {

    .page-container {
        padding: 25px 15px;
    }

    .page-header {
        align-items: flex-start;
        flex-direction: column;
    }

    .form-card {
        padding: 22px;
    }

    .form-actions {
        flex-direction: column-reverse;
    }

    .primary-button,
    .secondary-button {
        width: 100%;
    }

}

</style>

{% endblock %}
