{% extends "base.html" %}

{% block title %}
Recuperação Administrativa
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <h2 class="mb-3">
                        Recuperação Administrativa
                    </h2>

                    <p class="text-muted">
                        Esta ferramenta é temporária e será
                        removida após a recuperação do acesso.
                    </p>

                    <form method="POST">

                        <input
                            type="hidden"
                            name="csrf_token"
                            value="{{ csrf_token() }}"
                        >

                        <div class="mb-3">

                            <label
                                for="chave"
                                class="form-label"
                            >
                                Chave de recuperação
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="chave"
                                name="chave"
                                required
                                autocomplete="off"
                            >

                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Recuperar administrador
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
