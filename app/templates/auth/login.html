
{% extends "base.html" %}

{% block title %}Login - Agendamento RG/CIN{% endblock %}

{% block header_actions %}
<a href="{{ url_for('public.index') }}" class="login-header-back">
    Voltar
</a>
{% endblock %}

{% block content %}

<section class="login-page">

    <div class="login-card">

        <div class="login-header">

            <div class="login-icon">
                <img
                    src="{{ url_for('static', filename='img/logo_brasao).png') }}"
                    alt="Brasão da Prefeitura Municipal de Uauá"
                >
            </div>

            <h1>Acesso administrativo</h1>

           
        </div>

        <form method="post">

            <div class="form-group">
                <label for="username">
                    Usuário
                </label>

                <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    placeholder="Digite seu usuário"
                    required
                >

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >
            </div>

            <div class="form-group">
                <label for="password">
                    Senha
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Digite sua senha"
                    required
                >
            </div>

            <button
                class="primary full"
                type="submit"
            >
                Entrar
            </button>

        </form>

    </div>

</section>

<style>

/* Botão voltar no cabeçalho */

.topbar .header-actions .login-header-back {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 9px 18px;
    border-radius: 7px;
    color: #123b5d;
    background: #ffffff;
    border: 1px solid #d5e0e8;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    transition: all 0.25s ease;
}

.topbar .header-actions .login-header-back:hover {
    color: #ffffff;
    background: #123b5d;
    border-color: #123b5d;
    transform: translateY(-2px);
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
}

/* Página de login */

.login-page {
    min-height: calc(100vh - 120px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background: #f5f7fa;
}

.login-card {
    width: 100%;
    max-width: 430px;
    background: #ffffff;
    border-radius: 18px;
    padding: 40px;
    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
    border: 1px solid #e9edf2;
}

.login-header {
    text-align: center;
    margin-bottom: 18px;
}

.login-icon {
    width:140px;
    height:140px;
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.login-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.login-header h1 {
    margin: 0 0 8px;
    font-size: 26px;
    color: #1f2937;
}

.login-header p {
    margin: 0;
    color: #6b7280;
    font-size: 14px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-size: 14px;
    font-weight: 600;
    color: #374151;
}

.form-group input {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid #d8dee6;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    transition: 0.2s;
}

.form-group input:focus {
    border-color: #374151;
    box-shadow: 0 0 0 3px rgba(55, 65, 81, 0.08);
}

.primary.full {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 14px;
    background: #1f2937;
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}

.primary.full:hover {
    background: #111827;
}

@media (max-width: 600px) {

    .login-page {
        padding: 25px 15px;
    }

    .login-card {
        padding: 30px 22px;
        border-radius: 15px;
    }

    .login-header h1 {
        font-size: 23px;
    }

    .login-icon {
        width: 120px;
        height: 120px;
    }

}

</style>

{% endblock %}
