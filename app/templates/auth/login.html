{% extends "base.html" %}

{% block title %}Login - Agendamento RG{% endblock %}

{% block content %}

<section class="login-page">

    <div class="login-card">

        <div class="login-header">
            <div class="login-icon">
                RG
            </div>

            <h1>Acesso administrativo</h1>

            <p>
                Entre para administrar os agendamentos.
            </p>
        </div>

        <form method="post">

            <div class="form-group">
                <label for="username">
                    Usuário
                </label>

                <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    placeholder="Digite seu usuário"
                    required
                >
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >
            </div>

            <div class="form-group">
                <label for="password">
                    Senha
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Digite sua senha"
                    required
                >
            </div>

            <button
                class="primary full"
                type="submit"
            >
                Entrar
            </button>

        </form>

        <a
            class="back-link"
            href="{{ url_for('public.index') }}"
        >
            Voltar para o início
        </a>

    </div>

</section>

<style>

.login-page {
    min-height: calc(100vh - 120px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background: #f5f7fa;
}

.login-card {
    width: 100%;
    max-width: 430px;
    background: #ffffff;
    border-radius: 18px;
    padding: 40px;
    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
    border: 1px solid #e9edf2;
}

.login-header {
    text-align: center;
    margin-bottom: 30px;
}

.login-icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 18px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 16px;

    background: #1f2937;
    color: #ffffff;

    font-size: 20px;
    font-weight: 700;
    letter-spacing: 1px;
}

.login-header h1 {
    margin: 0 0 8px;
    font-size: 26px;
    color: #1f2937;
}

.login-header p {
    margin: 0;
    color: #6b7280;
    font-size: 14px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-size: 14px;
    font-weight: 600;
    color: #374151;
}

.form-group input {
    width: 100%;
    padding: 13px 14px;

    border: 1px solid #d8dee6;
    border-radius: 10px;

    font-size: 15px;
    outline: none;

    transition: 0.2s;
}

.form-group input:focus {
    border-color: #374151;
    box-shadow: 0 0 0 3px rgba(55, 65, 81, 0.08);
}

.primary.full {
    width: 100%;
    border: none;
    border-radius: 10px;

    padding: 14px;

    background: #1f2937;
    color: #ffffff;

    font-size: 15px;
    font-weight: 600;

    cursor: pointer;

    transition: 0.2s;
}

.primary.full:hover {
    background: #111827;
}

.back-link {
    display: block;
    margin-top: 24px;

    text-align: center;

    color: #6b7280;
    text-decoration: none;

    font-size: 14px;
}

.back-link:hover {
    color: #1f2937;
}

@media (max-width: 600px) {

    .login-page {
        padding: 25px 15px;
    }

    .login-card {
        padding: 30px 22px;
        border-radius: 15px;
    }

    .login-header h1 {
        font-size: 23px;
    }
}

</style>

{% endblock %}
